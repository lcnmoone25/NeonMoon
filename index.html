<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hayden · Fangirl Café</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;background:#b9dff2;color:#72544c}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:20px;left:22px;z-index:2;pointer-events:none}.top h1{margin:0;font-size:clamp(25px,4vw,44px);color:#fff8f2;text-shadow:0 3px 0 #b7897f,0 5px 15px #7caec1;letter-spacing:1px}.top p{margin:5px 0;color:#73544b;font-size:13px;font-weight:700}.panel{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:9px;background:#fffaf1ed;border:2px solid #e5cfc1;border-radius:24px;box-shadow:0 8px 28px #5b87974d;z-index:3;max-width:calc(100vw - 20px)}button{font:700 13px ui-rounded,system-ui,sans-serif;border:1.5px solid #d9b9ac;border-radius:15px;padding:11px 14px;background:#fffaf5;color:#74574f;cursor:pointer;white-space:nowrap}button.active,button:hover{background:#ffd4da;border-color:#e6a8b2}.tip{position:fixed;right:16px;top:20px;background:#fffaf2e8;border:1px solid #ead4c8;padding:12px 14px;border-radius:16px;font-size:12px;line-height:1.6;max-width:205px;z-index:2}.info{position:fixed;left:18px;bottom:95px;background:#fffaf2e8;border:1px solid #ead4c8;padding:12px 15px;border-radius:16px;font-size:12px;max-width:260px;line-height:1.5;z-index:2}.info strong{font-size:15px}.hidden{display:none}@media(max-width:600px){.top{top:12px;left:12px}.tip{top:83px;right:9px;font-size:10px;max-width:150px}.info{left:9px;bottom:89px;max-width:190px;font-size:10px}.panel{bottom:10px;gap:4px;padding:6px}button{padding:10px 9px;font-size:11px}}</style></head><body><div class="top"><h1>Hayden ♡</h1><p>FANGIRL CAFÉ · ファンカフェ</p></div><div class="tip">↔ Kéo để xoay · Cuộn để zoom<br>Chọn tầng để khám phá nội thất</div><div id="info" class="info"><strong>Hayden Fangirl Café</strong><br>Tiệm cà phê Nhật pastel, khu photocard, bánh ngọt và rooftop.</div><div class="panel"><button data-view="outside" class="active">🏠 Bên ngoài</button><button data-view="first">☕ Tầng 1</button><button data-view="second">🎀 Tầng 2</button><button data-view="roof">☁ Rooftop</button><button id="reset">↻ Góc nhìn</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
(()=>{'use strict';const T=window.THREE;if(!T){document.querySelector('.tip').textContent='Không tải được Three.js. Vui lòng kết nối internet.';return}const scene=new T.Scene();scene.background=new T.Color('#b9dff2');scene.fog=new T.Fog('#b9dff2',35,85);const cam=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,150);const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0xb4b4b0,1.3));const sun=new T.DirectionalLight(0xffffff,1.9);sun.position.set(-9,18,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;sun.shadow.bias=-.0003;scene.add(sun);const C={cream:'#fff1df',wall:'#f8e7d8',pink:'#f6b7bd',rose:'#e9a0aa',wood:'#c99570',dark:'#886658',glass:'#d9f4ed',mint:'#a8c9aa',floor:'#f6e6cd',gold:'#e7be7d',white:'#fff9f0',choc:'#705043'};const mat=(color,extra={})=>new T.MeshStandardMaterial({color,roughness:.84,metalness:0,...extra});const m={};Object.keys(C).forEach(k=>m[k]=mat(C[k]));const G={outside:new T.Group(),first:new T.Group(),second:new T.Group(),roof:new T.Group()};Object.values(G).forEach(g=>scene.add(g));function box(p,w,h,d,x,y,z,ma,rad=0){const o=new T.Mesh(new T.BoxGeometry(w,h,d),ma);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function sph(p,r,x,y,z,ma,s=[1,1,1]){const o=new T.Mesh(new T.SphereGeometry(r,20,14),ma);o.position.set(x,y,z);o.scale.set(...s);o.castShadow=true;p.add(o);return o}function cyl(p,r1,r2,h,x,y,z,ma,n=20){const o=new T.Mesh(new T.CylinderGeometry(r1,r2,h,n),ma);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o}function txt(p,str,x,y,z,sz=.25,color='#75554b',rot=0){const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=256;const c=canvas.getContext('2d');c.clearRect(0,0,1024,256);c.fillStyle=color;c.font='bold 125px Trebuchet MS, Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(str,512,135);const tex=new T.CanvasTexture(canvas);tex.encoding=T.sRGBEncoding;const o=new T.Mesh(new T.PlaneGeometry(sz*4,sz),new T.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,side:T.DoubleSide}));o.position.set(x,y,z);o.rotation.y=rot;p.add(o);return o}function heart(p,x,y,z,s=.15){const a=m.rose;sph(p,s,x-s*.55,y,z,a,[1,1,.5]);sph(p,s,x+s*.55,y,z,a,[1,1,.5]);const o=box(p,s*1.8,s*1.8,s*.65,x,y-s*.58,z,a);o.rotation.z=Math.PI/4}function flower(p,x,y,z,s=.17){for(let i=0;i<5;i++){const a=i*Math.PI*2/5;sph(p,s,x+Math.sin(a)*s*1.05,y+Math.cos(a)*s*1.05,z,m.pink,[.9,.9,.5])}sph(p,s*.62,x,y,z+.07,m.gold)}function bunny(p,x,y,z,scale=1){const b=new T.Group();b.position.set(x,y,z);b.scale.setScalar(scale);p.add(b);sph(b,.35,0,.42,0,m.white,[1,1,.82]);sph(b,.24,0,.09,0,m.white,[1,.85,.8]);for(const dx of [-.17,.17]){sph(b,.13,dx,.91,0,m.white,[.7,2,.62]);sph(b,.045,dx,.44,.28,m.choc)}sph(b,.045,0,.35,.29,m.rose);return b}function plant(p,x,y,z){cyl(p,.19,.15,.35,x,y+.17,z,m.rose);for(let i=0;i<5;i++){const a=i*2.4;sph(p,.21,x+Math.sin(a)*.2,y+.52+i*.03,z+Math.cos(a)*.18,m.mint,[.65,1.3,.65])}}function table(p,x,y,z){cyl(p,.07,.07,.5,x,y+.25,z,m.wood);cyl(p,.52,.52,.09,x,y+.54,z,m.cream);cyl(p,.25,.25,.05,x,y+.04,z,m.wood);cyl(p,.11,.09,.14,x+.14,y+.66,z,m.white);sph(p,.07,x+.14,y+.76,z,m.pink)}function chair(p,x,y,z){cyl(p,.31,.31,.12,x,y+.26,z,m.rose);box(p,.54,.48,.1,x,y+.55,z+.22,m.pink);for(const a of [-.2,.2])for(const b of [-.2,.2])cyl(p,.035,.035,.27,x+a,y+.12,z+b,m.wood)}function shelf(p,x,y,z){box(p,1.35,1.65,.28,x,y+.84,z,m.wood);for(let k=0;k<3;k++){box(p,1.3,.08,.38,x,y+.35+k*.52,z+.13,m.cream);for(let j=0;j<4;j++)box(p,.15,.24,.08,x-.44+j*.27,y+.5+k*.52,z+.35,[m.pink,m.mint,m.white,m.rose][(k+j)%4])}}function lamp(p,x,y,z){cyl(p,.025,.025,.35,x,y,z,m.wood);sph(p,.15,x,y-.2,z,mat('#ffe5a5',{emissive:'#ffc88b',emissiveIntensity:.3}),[1,.7,1])}function pastry(p,x,y,z){cyl(p,.19,.2,.13,x,y,z,m.cream);sph(p,.1,x,y+.09,z,m.rose,[1,.5,1])}
// Floating island, matching the existing simple isometric town style.
const base=new T.Group();scene.add(base);box(base,11,.68,9,0,-.48,0,mat('#dfd1bd'));box(base,10.3,.24,8.3,0,-.95,0,mat('#a6b98c'));box(base,8.8,.34,7.2,0,-1.23,0,mat('#93795e'));box(base,10.7,.12,8.7,0,-.08,0,m.floor);for(let i=0;i<23;i++){const x=(i*1.77%10)-5,z=(i*2.39%8)-4;box(base,.2,.035,.055,x,-.43,z,mat('#fff0dc'))}
// Exterior building, modular so roof and upper floor can disappear in interior mode.
const ex=G.outside;box(ex,7.25,3.15,5.65,0,1.58,0,m.wall);box(ex,7.48,.2,5.85,0,3.15,0,m.cream);box(ex,7.25,2.55,5.65,0,4.5,0,m.cream);box(ex,7.5,.22,5.9,0,5.8,0,m.wood);for(const x of [-3.52,3.52])for(const z of [-2.74,2.74])box(ex,.16,3.15,.16,x,1.6,z,m.wood);box(ex,1.28,2.35,.12,-1.75,1.2,2.89,m.wood);box(ex,1.02,2.15,.14,-1.75,1.18,2.98,m.glass);sph(ex,.07,-1.33,1.15,3.08,m.gold);for(let i=0;i<3;i++){const x=.1+i*1.03;box(ex,.91,2.15,.13,x,1.55,2.91,m.wood);box(ex,.79,2.02,.15,x,1.56,3,m.glass);box(ex,.055,2.08,.17,x,1.56,3.09,m.cream)}for(let i=0;i<8;i++){const x=-2.95+i*.85;box(ex,.81,.11,1.13,x,2.88,3.4,i%2?m.white:m.pink)}box(ex,7.6,.12,.2,0,2.82,3.86,m.rose);box(ex,4.1,1.03,.25,0,3.15,3.08,m.wood);box(ex,3.86,.82,.28,0,3.15,3.24,m.cream);txt(ex,'Hayden',0,3.33,3.41,.75);txt(ex,'FANGIRL CAFÉ',0,2.98,3.42,.22);for(let i=0;i<4;i++)lamp(ex,-2.8+i*1.85,2.78,3.42);box(ex,1.4,1.5,.13,-3.75,1.75,1.35,m.rose);txt(ex,'♡',-3.75,1.8,1.45,.35, '#fff9f1',-Math.PI/2);box(ex,.12,1.7,.8,3.67,1.8,1.1,m.rose);txt(ex,'COFFEE',3.76,2.1,1.1,.2,'#fffaf3',Math.PI/2);txt(ex,'& MERCH',3.76,1.85,1.1,.17,'#fffaf3',Math.PI/2);for(const x of [-2.8,2.9])plant(ex,x,0,3.2);table(ex,3.3,0,4);chair(ex,2.6,0,4);chair(ex,4,0,4);box(ex,1.1,.85,.12,-3.1,.55,3.62,m.wood);txt(ex,'MENU ♡',-3.1,.68,3.7,.2,'#fffaf3');for(let i=0;i<3;i++){box(ex,1.1,.08,.2,-2.7+i*.9,0,4.7,m.wood)}bunny(ex,-3.15,.03,3.3,.5);heart(ex,2.9,3.5,3.04,.11);
// Rooftop: exposed in outside and rooftop mode.
function makeRoof(p,y){for(let i=0;i<4;i++){const x=i%2?-3.45:3.45,z=i<2?-2.65:2.65;box(p,.12,.9,.12,x,y+.45,z,m.wood)}for(const z of [-2.65,2.65])box(p,7,.11,.12,0,y+.9,z,m.wood);for(const x of [-3.45,3.45])box(p,.12,.11,5.3,x,y+.9,0,m.wood);table(p,-1.8,y,0);chair(p,-2.6,y,0);chair(p,-1.1,y,0);table(p,1.8,y,.9);chair(p,2.5,y,.9);cyl(p,.08,.08,2,1.8,y+1.6,.9,m.wood);const canopy=new T.Mesh(new T.ConeGeometry(1.22,.53,8),m.cream);canopy.position.set(1.8,y+2.55,.9);canopy.castShadow=true;p.add(canopy);bunny(p,-2.85,y,-1.6,.55);plant(p,3,y,-2.1);plant(p,-3,y,2.1)}makeRoof(ex,5.91);
// First-floor interior, deliberately open on the front and right for inspection.
const f=G.first;box(f,7.25,.18,5.65,0,.02,0,m.floor);box(f,7.25,3.05,.17,0,1.57,-2.78,m.wall);box(f,.17,3.05,5.65,-3.54,1.57,0,m.wall);box(f,7.25,.22,.2,0,3.07,-2.78,m.wood);for(let i=0;i<3;i++)lamp(f,-2.2+i*2.2,2.72,-.4);box(f,4.6,.95,1.25,1.15,.5,-1.95,m.wood);box(f,4.75,.14,1.35,1.15,1.02,-1.95,m.cream);box(f,1.1,.56,.8,2.15,1.36,-1.96,m.glass);for(let i=0;i<4;i++)pastry(f,1.65+i*.3,1.14,-1.65);for(let i=0;i<3;i++){cyl(f,.12,.12,.3,-.2+i*.35,1.24,-1.9,m.white);sph(f,.1,-.2+i*.35,1.42,-1.9,m.rose)}txt(f,'COFFEE · CAKE',0,2.3,-2.63,.32);for(let i=0;i<3;i++){const x=-1.85+i*1.6;table(f,x,0,1.05);chair(f,x-.48,0,1.75);chair(f,x+.48,0,1.75)}shelf(f,-2.8,0,-2.4);plant(f,3.02,0,1.55);box(f,1.2,1.6,.12,3.38,1.8,-.8,m.pink);txt(f,'PHOTO',3.38,2.02,-.71,.22);heart(f,3.37,1.7,-.69,.17);bunny(f,3.1,.02,.9,.62);
// Second-floor interior: event room, photocard wall and merch.
const s=G.second;box(s,7.25,.18,5.65,0,.02,0,m.floor);box(s,7.25,3.05,.17,0,1.57,-2.78,m.wall);box(s,.17,3.05,5.65,-3.54,1.57,0,m.wall);box(s,3.8,.13,1.35,0,.56,.2,m.wood);for(const x of [-1.35,-.45,.45,1.35])chair(s,x,0,1.3);box(s,2.55,1.55,.12,1.1,1.87,-2.62,m.cream);txt(s,'FAN EVENT ♡',1.1,2.18,-2.51,.31);bunny(s,1.1,1.12,-2.44,.64);for(let i=0;i<5;i++)box(s,.39,.52,.12,-2.45+i*.7,1.8,-2.57,[m.pink,m.rose,m.mint,m.cream,m.pink][i]);shelf(s,-2.78,0,-1.5);shelf(s,2.8,0,-1.5);for(let i=0;i<3;i++){const x=-2.5+i*.9;box(s,.45,.68,.07,x,1.95,-2.48,m.wood);box(s,.34,.57,.08,x,1.95,-2.42,m.pink)}table(s,2.5,0,1.5);chair(s,2,0,2.1);chair(s,3,0,2.1);plant(s,-3,0,2);for(let i=0;i<4;i++)lamp(s,-2.7+i*1.8,2.7,.2);
// Rooftop-only view: the terrace, without enclosing building.
const r=G.roof;box(r,7.4,.3,5.9,0,-.18,0,m.cream);makeRoof(r,0);
let view='outside';const labels={outside:['Hayden Fangirl Café','Tiệm cà phê Nhật pastel, khu photocard, bánh ngọt và rooftop.'],first:['Tầng 1 · Café & Dessert','Quầy order, bánh ngọt, bàn đôi, góc merchandise và photo spot.'],second:['Tầng 2 · Fan Event Lounge','Phòng xem livestream, tổ chức cup-sleeve event, photocard wall và góc fan merch.'],roof:['Rooftop · Chill & Photo','Bàn ngoài trời, dù kem, cây xanh và góc chụp ảnh.']};function setView(v){view=v;Object.keys(G).forEach(k=>G[k].visible=k===v);const [a,b]=labels[v];document.getElementById('info').innerHTML='<strong>'+a+'</strong><br>'+b;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));targetY=v==='outside'?2.1:v==='roof'?0.7:1.3;radius=v==='outside'?18:12.5}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));let theta=.67,phi=1.07,radius=18,targetY=2.1,drag=false,lastX=0,lastY=0;const el=renderer.domElement;el.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',()=>drag=false);el.addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-lastX)*.007;phi=Math.max(.2,Math.min(1.5,phi+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});el.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(7,Math.min(28,radius+e.deltaY*.012))},{passive:false});document.getElementById('reset').onclick=()=>{theta=.67;phi=1.07;radius=view==='outside'?18:12.5};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);const center=new T.Vector3(0,targetY,0);cam.position.set(center.x+radius*Math.sin(phi)*Math.sin(theta),center.y+radius*Math.cos(phi),center.z+radius*Math.sin(phi)*Math.cos(theta));cam.lookAt(center);renderer.render(scene,cam)}setView('outside');animate()})();
